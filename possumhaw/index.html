
<!doctype html>
<html>
<head>
   <meta charset="utf-8">
   <title>Possumhaw</title>

   <style>
      html, body {
         margin: 0;
         padding: 0;
         width: 600px;
         height: 400px;
         background: #000;
         overflow: hidden;
      }

      #game-wrap {
         width: 600px;
         height: 400px;
         background: #000;
      }

      canvas {
         display: block;
         width: 600px;
         height: 400px;
         background: #000;
         outline: none;
         image-rendering: pixelated;
      }

      #game-wrap:fullscreen {
         width: 100vw;
         height: 100vh;
         display: flex;
         align-items: center;
         justify-content: center;
         background: #000;
      }

      #game-wrap:fullscreen canvas {
         width: min(100vw, 150vh);
         height: auto;
      }
   </style>
</head>

<body>
   <div id="game-wrap">
      <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
   </div>

   <script src="odin.js"></script>
   <script>
      var wasmExports = null;

      var odinMemoryInterface = new odin.WasmMemoryInterface();
      odinMemoryInterface.setIntSize(4);

      var odinImports = odin.setupDefaultImports(odinMemoryInterface);

      var Module = {
         canvas: document.getElementById("canvas"),

         instantiateWasm: (imports, successCallback) => {
            const mergedImports = {
               ...imports,
               ...odinImports,

               env: {
                  ...(imports.env || {}),
                  ...(odinImports.env || {}),
               },
            };

            return WebAssembly.instantiateStreaming(fetch("index.wasm"), mergedImports).then((output) => {
               const e = output.instance.exports;

               wasmExports = e;
               odinMemoryInterface.setExports(e);
               odinMemoryInterface.setMemory(e.memory);

               successCallback(output.instance);
               return e;
            });
         },

         onRuntimeInitialized: () => {
            wasmExports._start();
         },
      };
   </script>

   <script async type="text/javascript" src="index.js"></script>
</body>
</html>
